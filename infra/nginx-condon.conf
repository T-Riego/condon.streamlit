# ============================================================
# /etc/nginx/sites-available/condon
# ln -sf /etc/nginx/sites-available/condon /etc/nginx/sites-enabled/condon
#
# SSL (proxy Cloudflare OFF para os condon.*):
#   certbot --nginx -d condon.streamlit.riegos.dev -d condon.web.riegos.dev -d condon.api.riegos.dev
#
# SSL portainer.riegos.dev (proxy Cloudflare ON — HTTP-01 passa pelo Cloudflare):
#   certbot --nginx -d portainer.riegos.dev
# ============================================================

# ----------------------------------------------------------------
# portainer.riegos.dev  →  Portainer :9000
# (Cloudflare proxy ON — nginx recebe na 80 vindo do Cloudflare,
#  Cloudflare entrega HTTPS ao browser via certificado deles)
# ----------------------------------------------------------------
server {
    listen 80;
    server_name portainer.riegos.dev;

    # Permite HTTP-01 challenge do certbot mesmo com proxy Cloudflare ON
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name portainer.riegos.dev;

    ssl_certificate     /etc/letsencrypt/live/portainer.riegos.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.riegos.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ----------------------------------------------------------------
# condon.streamlit.riegos.dev  →  Traefik → container Streamlit
# (Cloudflare proxy OFF — certbot direto)
# ----------------------------------------------------------------
server {
    listen 80;
    server_name condon.streamlit.riegos.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name condon.streamlit.riegos.dev;

    ssl_certificate     /etc/letsencrypt/live/condon.streamlit.riegos.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condon.streamlit.riegos.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Streamlit usa WebSocket
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }
}

